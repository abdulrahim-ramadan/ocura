[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocura"
# One source of truth, read from src/ocura/__init__.py — see that file.
dynamic = ["version"]
description = "Windows desktop app for better screen habits - context-aware break reminders."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Abdulrahim Ramadan", email = "Abdalrhim19991@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["PySide6-Essentials>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
ocura = "ocura.ui.app:main"

[project.urls]
Homepage = "https://github.com/abdulrahim-ramadan/ocura"

[tool.hatch.version]
path = "src/ocura/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ocura"]
artifacts = ["src/ocura/ui/*.qss", "src/ocura/ui/assets/*", "src/ocura/ui/i18n/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["gui: needs a real display; skipped where none exists"]

[tool.coverage.run]
branch = true
source = ["ocura"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID"]

# Platform and storage bans are scoped to src/ocura/domain/.ruff.toml, since
# infrastructure is the layer that is supposed to import those.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PySide6".msg = "No layer below the UI may import a UI toolkit."
